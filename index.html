<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Hệ thống Quản lý Thí nghiệm</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .module-card { cursor: pointer; transition: 0.3s; }
        .module-card:hover { transform: translateY(-5px); box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
    <div class="container py-5">
        <h2 class="text-center mb-4 text-primary">HỆ THỐNG QUẢN LÝ THÍ NGHIỆM THIẾT BỊ ĐIỆN</h2>
        <div class="row g-4" id="menu-grid">
            <!-- Các Module thiết bị -->
            <script>
                const modules = ['MC', 'DCL', 'TU', 'TI', 'MBA', 'KHANG', 'DAU', 'TUBU', 'CS', 'CAP'];
                modules.forEach(mod => {
                    document.write(`
                        <div class="col-md-3">
                            <div class="card module-card text-center p-4 h-100 border-primary" onclick="loadModule('${mod}')">
                                <div class="card-body">
                                    <h4 class="card-title text-uppercase text-primary">${mod}</h4>
                                    <p class="card-text text-muted">Quản lý & Thí nghiệm thiết bị ${mod}</p>
                                </div>
                            </div>
                        </div>
                    `);
                });
            </script>
        </div>
        
        <!-- Khu vực hiển thị nội dung Module được chọn -->
        <div id="module-container" class="mt-5"></div>
    </div>

    <script>
        function loadModule(modName) {
            // Hiển thị khung chứa và thông báo đang tải
            const container = document.getElementById('module-container');
            container.innerHTML = `<div class="text-center"><div class="spinner-border text-primary" role="status"></div> Đang tải module ${modName}...</div>`;
            
            // Gọi Apps Script để load nội dung file HTML tương ứng (ví dụ mc.html, dcl.html...)
            google.script.run
                .withSuccessHandler(function(htmlContent) {
                    container.innerHTML = htmlContent;
                })
                .withFailureHandler(function(err) {
                    container.innerHTML = `<div class="alert alert-danger">Lỗi tải module: ${err.message}</div>`;
                })
                .includeHtmlModule(modName); // Hàm phụ trợ hoặc trả về trực tiếp tùy cách tổ chức template
        }
    </script>
</body>
</html>
